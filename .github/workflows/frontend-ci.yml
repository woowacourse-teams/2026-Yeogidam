# PR에서 코드 품질을 검사하고 Android/iOS Debug 앱이 컴파일되는지 확인한다.
name: Frontend CI

on:
  pull_request:
    branches: # branches는 PR의 대상 브랜치다.
      - fe-dev
      - fe-release
  # 테스터 배포 워크플로에서도 이 CI 전체를 재사용할 수 있다.
  workflow_call:

# 소스 체크아웃에 필요한 읽기 권한만 허용한다.
permissions:
  contents: read

# 세 job은 서로 독립적이므로 검증과 두 플랫폼 빌드가 병렬로 실행된다.
jobs:
  # JavaScript/TypeScript 정적 검사와 Jest 테스트를 수행한다.
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        # 이 job의 run 명령은 모두 Frontend 디렉터리에서 실행한다.
        working-directory: Frontend
    steps:
      # GitHub runner에 저장소 소스를 내려받는다.
      - uses: actions/checkout@v6
      # .nvmrc의 Node 버전을 사용하고 lockfile 기준으로 npm 캐시를 관리한다.
      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      # package-lock.json에 고정된 버전으로 의존성을 설치한다.
      - name: Install dependencies
        run: npm ci

      # ESLint 규칙을 검사한다.
      - name: Lint
        run: npm run lint

      # TypeScript 타입 오류를 검사한다.
      - name: Typecheck
        run: npm run typecheck

      # Watchman 없이 Jest 테스트를 한 번 실행한다.
      - name: Test
        run: npm run test:ci

  # 스토어 서명 없이 Android Debug APK가 컴파일되는지 확인한다.
  android-build:
    runs-on: ubuntu-latest
    # 네이티브 빌드가 멈추면 60분 후 종료한다.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Frontend
    steps:
      # 각 job은 별도 runner를 사용하므로 소스와 Node 의존성을 다시 준비한다.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      # Android Gradle 설정의 Java 21을 설치하고 Gradle 의존성을 캐시한다.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            Frontend/android/*.gradle
            Frontend/android/gradle.properties
            Frontend/android/gradle/wrapper/gradle-wrapper.properties
      - name: Install dependencies
        run: npm ci
      # 빌드 설정이 요구하는 값을 채운다. 실제 서비스 호출은 하지 않으므로 임시 값만 사용한다.
      # 이 .env는 runner 안에서만 만들어지며 저장소에는 커밋되지 않는다.
      - name: Create CI build configuration
        run: |
          printf '%s\n' \
            'KAKAO_NATIVE_APP_KEY=ci-placeholder' \
            'SUPABASE_URL=https://ci.example.invalid' \
            'SUPABASE_PUBLISHABLE_KEY=ci-placeholder' > .env
      # Gradle wrapper로 Debug APK를 컴파일한다. 이 단계는 Play 업로드용 AAB를 만들지 않는다.
      - name: Build Android debug app
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD: 'true'
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: Frontend/android

  # Apple 배포 서명 없이 iOS 시뮬레이터용 Debug 앱이 컴파일되는지 확인한다.
  ios-build:
    # Xcode와 iOS Simulator SDK가 있는 macOS runner가 필요하다.
    runs-on: macos-26
    # CocoaPods 설치와 네이티브 컴파일 시간을 고려해 120분으로 제한한다.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: Frontend
    steps:
      # iOS도 별도 runner이므로 소스와 Node 의존성을 다시 준비한다.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      # Gemfile.lock에 기록된 Ruby/Bundler 환경과 CocoaPods gem을 준비한다.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          working-directory: Frontend
      - name: Install dependencies
        run: npm ci
      # Android와 동일하게 컴파일용 임시 설정만 사용한다.
      - name: Create CI build configuration
        run: |
          printf '%s\n' \
            'KAKAO_NATIVE_APP_KEY=ci-placeholder' \
            'SUPABASE_URL=https://ci.example.invalid' \
            'SUPABASE_PUBLISHABLE_KEY=ci-placeholder' > .env
      # Podfile에 선언된 iOS 네이티브 라이브러리를 설치해 .xcworkspace를 준비한다.
      - name: Install CocoaPods
        run: bundle exec pod install --project-directory=ios
      # Debug 설정을 iOS Simulator SDK로 빌드한다. 특정 시뮬레이터를 실행하지는 않는다.
      # 중간 결과물은 runner 임시 폴더에 두고, 시뮬레이터 빌드의 코드 서명은 끈다.
      - name: Build iOS debug simulator app
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD: 'true'
        run: |
          xcodebuild \
            -workspace ios/Frontend.xcworkspace \
            -scheme Frontend \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/FrontendDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
        # workspace/scheme: CocoaPods가 연결된 Frontend 앱을 선택한다.
        # configuration: Debug 설정을 사용한다.
        # sdk/destination: 실제 기기가 아닌 범용 iOS 시뮬레이터를 대상으로 한다.
        # derivedDataPath: 빌드 결과를 runner의 임시 폴더에 저장한다.
        # CODE_SIGNING_ALLOWED=NO: 시뮬레이터 빌드에는 배포 서명을 요구하지 않는다.
        # build: 앱을 컴파일하며 실행하거나 스토어에 업로드하지는 않는다.
