# PR에서는 코드 품질과 Android/iOS Release 컴파일을 검사한다.
# Beta 호출에서는 선택한 플랫폼의 배포용 Release 결과물을 만들어 artifact로 전달한다.
name: Frontend CI

on:
  pull_request:
    branches: # branches는 PR의 대상 브랜치다.
      - fe-dev
      - fe-release
  workflow_call:
    inputs:
      beta_platform:
        type: string
        default: ''
      app_version:
        type: string
        default: ''
      build_number:
        type: string
        default: ''

# 소스 체크아웃에 필요한 읽기 권한만 허용한다.
permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행은 결과가 쓸모없으므로 취소한다.
# beta 호출은 실행마다 그룹이 달라 서로 취소하지 않는다.
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# PR 검증은 병렬로 실행하고, beta 호출에서는 선택한 플랫폼만 빌드한다.
jobs:
  # PR이 플랫폼별 네이티브를 바꿨는지 판단해, 바꾸지 않은 플랫폼의 네이티브 빌드를 건너뛴다.
  # fingerprint.json의 플랫폼 해시가 base와 다르면 네이티브가 바뀐 것이다.
  # 해시가 실제 네이티브와 맞는지는 verify의 Check fingerprint가 보장한다.
  native-changes:
    if: inputs.beta_platform == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.detect.outputs.android }}
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      # PR의 merge 커밋과 그 첫 번째 부모(base 브랜치 HEAD)만 받는다.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Detect native changes
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # fe-release로 가는 PR은 beta 직전 관문이므로 항상 두 플랫폼을 모두 빌드한다.
          if [[ "$BASE_REF" == "fe-release" ]]; then
            echo "Release PR: building all platforms"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"

          # fingerprint에 잡히지 않지만 네이티브 빌드 방식을 바꾸는 파일들이다.
          common='^(\.github/workflows/frontend-ci\.yml|Frontend/\.nvmrc)$'
          ios_only='^Frontend/(Gemfile|Gemfile\.lock|ios/Podfile\.lock)$'

          hash() {
            node -e 'const [file, platform] = process.argv.slice(1); try { console.log(JSON.parse(require("fs").readFileSync(file, "utf8"))[platform].hash) } catch { console.log("missing") }' "$1" "$2"
          }
          git show HEAD^1:Frontend/fingerprint.json > "$RUNNER_TEMP/base-fingerprint.json" 2>/dev/null || true

          for platform in android ios; do
            base=$(hash "$RUNNER_TEMP/base-fingerprint.json" "$platform")
            head=$(hash Frontend/fingerprint.json "$platform")
            build=false
            if [[ "$base" != "$head" ]]; then
              build=true
            elif grep -Eq "$common" <<< "$changed"; then
              build=true
            elif [[ "$platform" == "ios" ]] && grep -Eq "$ios_only" <<< "$changed"; then
              build=true
            fi
            echo "$platform: base=$base head=$head build=$build"
            echo "$platform=$build" >> "$GITHUB_OUTPUT"
          done

  # JavaScript/TypeScript 정적 검사와 Jest 테스트를 수행한다.
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        # 이 job의 run 명령은 모두 Frontend 디렉터리에서 실행한다.
        working-directory: Frontend
    steps:
      # GitHub runner에 저장소 소스를 내려받는다.
      - uses: actions/checkout@v6
      # .nvmrc의 Node 버전을 사용하고 lockfile 기준으로 npm 캐시를 관리한다.
      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      # package-lock.json에 고정된 버전으로 의존성을 설치한다.
      - name: Install dependencies
        run: npm ci

      # ESLint 규칙을 검사한다.
      - name: Lint
        run: npm run lint

      # TypeScript 타입 오류를 검사한다.
      - name: Typecheck
        run: npm run typecheck

      # Watchman 없이 Jest 테스트를 한 번 실행한다.
      - name: Test
        run: npm run test:ci

      # 네이티브 빌드를 건너뛰는 PR에서도 Release 빌드가 하던 JS 번들 생성은 확인한다.
      # Metro가 import 해석이나 변환에 실패하면 여기서 잡힌다.
      - name: Bundle JavaScript (Release)
        run: |
          for platform in android ios; do
            npx react-native bundle \
              --platform "$platform" \
              --dev false \
              --minify false \
              --entry-file index.js \
              --bundle-output "$RUNNER_TEMP/bundle-$platform.js" \
              --assets-dest "$RUNNER_TEMP/assets-$platform"
          done

      # 네이티브 코드나 네이티브 라이브러리가 바뀌었는데 fingerprint.json을 갱신하지 않으면 실패한다.
      # OTA 번들은 이 해시가 같은 앱에만 배포되므로, 커밋된 값이 실제 네이티브와 일치해야 한다.
      - name: Check fingerprint
        run: |
          npx hot-updater fingerprint create
          if ! git diff --exit-code -- fingerprint.json; then
            echo "::error file=Frontend/fingerprint.json::네이티브 변경이 반영되지 않았습니다. Frontend에서 npx hot-updater fingerprint create를 실행하고 fingerprint.json을 커밋하세요."
            exit 1
          fi

  # PR에서는 스토어 서명 없이 Android Release APK가 컴파일되는지 확인한다.
  android-build:
    needs: native-changes
    if: inputs.beta_platform == '' && needs.native-changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    # 네이티브 빌드가 멈추면 60분 후 종료한다.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Frontend
    steps:
      # 각 job은 별도 runner를 사용하므로 소스와 Node 의존성을 다시 준비한다.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      # Android Gradle 설정의 Java 21을 설치하고 Gradle 의존성을 캐시한다.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            Frontend/android/*.gradle
            Frontend/android/gradle.properties
            Frontend/android/gradle/wrapper/gradle-wrapper.properties
      - name: Install dependencies
        run: npm ci
      # 빌드 설정이 요구하는 값을 채운다. 실제 서비스 호출은 하지 않으므로 임시 값만 사용한다.
      # 이 .env는 runner 안에서만 만들어지며 저장소에는 커밋되지 않는다.
      - name: Create CI build configuration
        run: |
          printf '%s\n' \
            'API_BASE_URL=https://ci.example.invalid' > .env
      # 러너 이미지에 없는 NDK를 Gradle이 빌드 중에 받다가 손상된 파일로 실패한 적이 있어,
      # build.gradle의 ndkVersion을 미리 설치하고 실패하면 지운 뒤 다시 받는다.
      - name: Install Android NDK
        working-directory: Frontend/android
        run: |
          ndk_version=$(sed -nE 's/.*ndkVersion = "([^"]+)".*/\1/p' build.gradle)
          if [[ -z "$ndk_version" ]]; then
            echo "ndkVersion not found in build.gradle" >&2
            exit 1
          fi
          ndk_dir="$ANDROID_HOME/ndk/$ndk_version"
          if [[ -f "$ndk_dir/source.properties" ]]; then
            echo "NDK $ndk_version is already installed"
            exit 0
          fi
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version" \
              && [[ -f "$ndk_dir/source.properties" ]]; then
              exit 0
            fi
            echo "NDK $ndk_version install failed (attempt $attempt/3)" >&2
            rm -rf "$ndk_dir"
            sleep $((attempt * 15))
          done
          exit 1
      # Gradle 배포 파일 다운로드만 재시도한다. 실제 컴파일 오류는 다시 실행하지 않는다.
      - name: Download Gradle distribution
        working-directory: Frontend/android
        run: |
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Gradle distribution download failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done
      - name: Build Android release app
        # PR에서는 저장소의 개발용 키로 Release 변형을 서명한다. 배포용 AAB는 만들지 않는다.
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/Frontend/android/app/debug.keystore
          ANDROID_UPLOAD_STORE_PASSWORD: android
          ANDROID_UPLOAD_KEY_ALIAS: androiddebugkey
          ANDROID_UPLOAD_KEY_PASSWORD: android
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD: 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            # 컴파일 확인이 목적이므로 실제 기기 대부분이 쓰는 arm64-v8a만 빌드해 C++ 컴파일을 1/4로 줄인다.
            # 배포용 AAB(android-beta-build)는 기존처럼 모든 ABI를 빌드한다.
            if ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tee "$RUNNER_TEMP/android-build.log"; then
              exit 0
            fi
            # 외부 저장소 응답 오류에만 재시도한다. 컴파일 오류는 즉시 실패로 남긴다.
            if ! grep -Eq 'Received status code (429|5[0-9][0-9])|Read timed out|Connection timed out|Gateway Time-out' "$RUNNER_TEMP/android-build.log"; then
              exit 1
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Android dependency download failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done
        working-directory: Frontend/android

  # PR에서는 Apple 배포 서명 없이 iOS 시뮬레이터용 Release 앱을 컴파일한다.
  ios-build:
    needs: native-changes
    if: inputs.beta_platform == '' && needs.native-changes.outputs.ios == 'true'
    # Xcode와 iOS Simulator SDK가 있는 macOS runner가 필요하다.
    runs-on: macos-26
    # CocoaPods 설치와 네이티브 컴파일 시간을 고려해 120분으로 제한한다.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: Frontend
    steps:
      # iOS도 별도 runner이므로 소스와 Node 의존성을 다시 준비한다.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      # Ruby 배포 파일 다운로드가 일시적으로 504를 반환하면 다시 시도한다.
      # 앞선 시도는 계속 진행 가능하게 두고, 마지막 시도 실패는 job 실패로 남긴다.
      - name: Set up Ruby (first attempt)
        id: setup-ruby-first
        continue-on-error: true
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          working-directory: Frontend
      - name: Wait before retrying Ruby setup
        if: steps.setup-ruby-first.outcome == 'failure'
        run: sleep 30
      - name: Set up Ruby (second attempt)
        if: steps.setup-ruby-first.outcome == 'failure'
        id: setup-ruby-second
        continue-on-error: true
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          working-directory: Frontend
      - name: Wait before final Ruby setup attempt
        if: steps.setup-ruby-second.outcome == 'failure'
        run: sleep 60
      - name: Set up Ruby (final attempt)
        if: steps.setup-ruby-second.outcome == 'failure'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          working-directory: Frontend
      - name: Install dependencies
        run: npm ci
      # Android와 동일하게 컴파일용 임시 설정만 사용한다.
      - name: Create CI build configuration
        run: |
          printf '%s\n' \
            'API_BASE_URL=https://ci.example.invalid' > .env
      # Podfile에 선언된 iOS 네이티브 라이브러리를 설치해 .xcworkspace를 준비한다.
      - name: Install CocoaPods
        run: |
          for attempt in 1 2 3 4 5; do
            if bundle exec pod install --project-directory=ios 2>&1 | tee "$RUNNER_TEMP/pod-install.log"; then
              exit 0
            fi
            if ! grep -Eq 'HTTPError: (429|5[0-9][0-9])|Read timed out|Connection timed out|Gateway Time-out' "$RUNNER_TEMP/pod-install.log"; then
              exit 1
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "CocoaPods install failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done
      # iOS Release 빌드는 fingerprint를 빌드 시점에 다시 계산해 앱에 넣는다.
      # pod install 이후 ios/ 파일이 바뀌어 커밋된 해시와 달라지면, 그 앱은 OTA 번들을 받지 못하므로 빌드 전에 멈춘다.
      - name: Check iOS fingerprint after pod install
        run: |
          expected=$(node -p "require('./fingerprint.json').ios.hash")
          actual=$(npx hot-updater fingerprint hash -p ios | tail -1)
          if [[ "$expected" != "$actual" ]]; then
            echo "::error file=Frontend/fingerprint.json::pod install 이후 iOS fingerprint가 달라졌습니다 ($expected -> $actual). 아래 바뀐 ios/ 파일을 확인하세요."
            git status --short -- ios
            exit 1
          fi
      # Release 설정을 iOS Simulator SDK로 빌드한다. 특정 시뮬레이터를 실행하지는 않는다.
      # 중간 결과물은 runner 임시 폴더에 두고, 시뮬레이터 빌드의 코드 서명은 끈다.
      - name: Build iOS release simulator app
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD: 'true'
        run: |
          xcodebuild \
            -workspace ios/Frontend.xcworkspace \
            -scheme Frontend \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/FrontendDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
        # workspace/scheme: CocoaPods가 연결된 Frontend 앱을 선택한다.
        # configuration: Release 설정을 사용한다.
        # sdk/destination: 실제 기기가 아닌 범용 iOS 시뮬레이터를 대상으로 한다.
        # derivedDataPath: 빌드 결과를 runner의 임시 폴더에 저장한다.
        # CODE_SIGNING_ALLOWED=NO: 시뮬레이터 빌드에는 배포 서명을 요구하지 않는다.
        # build: 앱을 컴파일하며 실행하거나 스토어에 업로드하지는 않는다.

  # Beta 호출에서는 배포 설정과 서명 키를 사용해 Android AAB를 한 번만 만든다.
  android-beta-build:
    if: inputs.beta_platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: fe-beta
    env:
      APP_VERSION: ${{ inputs.app_version }}
      APP_BUILD_NUMBER: ${{ inputs.build_number }}
      APP_ENV: production
      API_BASE_URL: https://yeogidam.duckdns.org
      HOT_UPDATER_URL: https://yeogidam-hot-updater.yeogidam.workers.dev
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            Frontend/android/*.gradle
            Frontend/android/gradle.properties
            Frontend/android/gradle/wrapper/gradle-wrapper.properties
      - name: Install dependencies
        run: npm ci
      - name: Prepare Android release secrets
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          HOT_UPDATER_CLIENT_KEY: ${{ secrets.HOT_UPDATER_CLIENT_KEY }}
        run: |
          for key in APP_VERSION APP_BUILD_NUMBER API_BASE_URL GOOGLE_MAPS_ANDROID_API_KEY \
            POSTHOG_PROJECT_TOKEN POSTHOG_HOST \
            ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD SENTRY_AUTH_TOKEN \
            HOT_UPDATER_URL HOT_UPDATER_CLIENT_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "Missing beta build setting: $key" >&2
              exit 1
            fi
          done
          printf 'GOOGLE_MAPS_ANDROID_API_KEY=%s\nAPI_BASE_URL=%s\nPOSTHOG_PROJECT_TOKEN=%s\nPOSTHOG_HOST=%s\nAPP_VERSION=%s\nAPP_ENV=%s\nHOT_UPDATER_URL=%s\nHOT_UPDATER_CLIENT_KEY=%s\n' \
            "$GOOGLE_MAPS_ANDROID_API_KEY" "$API_BASE_URL" \
            "$POSTHOG_PROJECT_TOKEN" "$POSTHOG_HOST" "$APP_VERSION" "$APP_ENV" \
            "$HOT_UPDATER_URL" "$HOT_UPDATER_CLIENT_KEY" > "$RUNNER_TEMP/frontend-beta-config"
          chmod 600 "$RUNNER_TEMP/frontend-beta-config"
          echo "ENVFILE=$RUNNER_TEMP/frontend-beta-config" >> "$GITHUB_ENV"
          echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "SENTRY_ORG=yeogidam" >> "$GITHUB_ENV"
          echo "SENTRY_PROJECT=react-native" >> "$GITHUB_ENV"
          echo "SENTRY_URL=https://sentry.io/" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/android-upload.jks" >> "$GITHUB_ENV"
      # 러너 이미지에 없는 NDK를 Gradle이 빌드 중에 받다가 손상된 파일로 실패한 적이 있어,
      # build.gradle의 ndkVersion을 미리 설치하고 실패하면 지운 뒤 다시 받는다.
      - name: Install Android NDK
        working-directory: Frontend/android
        run: |
          ndk_version=$(sed -nE 's/.*ndkVersion = "([^"]+)".*/\1/p' build.gradle)
          if [[ -z "$ndk_version" ]]; then
            echo "ndkVersion not found in build.gradle" >&2
            exit 1
          fi
          ndk_dir="$ANDROID_HOME/ndk/$ndk_version"
          if [[ -f "$ndk_dir/source.properties" ]]; then
            echo "NDK $ndk_version is already installed"
            exit 0
          fi
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version" \
              && [[ -f "$ndk_dir/source.properties" ]]; then
              exit 0
            fi
            echo "NDK $ndk_version install failed (attempt $attempt/3)" >&2
            rm -rf "$ndk_dir"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build signed Android AAB
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon
        working-directory: Frontend/android
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-beta-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: Frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          compression-level: 0

  # Beta 호출에서는 실제 기기용 iOS Release 아카이브를 한 번만 만든다.
  ios-beta-build:
    if: inputs.beta_platform == 'ios'
    runs-on: macos-26
    timeout-minutes: 180
    environment: fe-beta
    env:
      APP_VERSION: ${{ inputs.app_version }}
      APP_BUILD_NUMBER: ${{ inputs.build_number }}
      APP_ENV: production
      API_BASE_URL: https://yeogidam.duckdns.org
      HOT_UPDATER_URL: https://yeogidam-hot-updater.yeogidam.workers.dev
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          working-directory: Frontend
      - name: Install dependencies
        run: npm ci
      - name: Prepare iOS release secrets
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          HOT_UPDATER_CLIENT_KEY: ${{ secrets.HOT_UPDATER_CLIENT_KEY }}
        run: |
          for key in APP_VERSION APP_BUILD_NUMBER API_BASE_URL GOOGLE_MAPS_IOS_API_KEY \
            POSTHOG_PROJECT_TOKEN POSTHOG_HOST \
            APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID SENTRY_AUTH_TOKEN \
            HOT_UPDATER_URL HOT_UPDATER_CLIENT_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "Missing beta build setting: $key" >&2
              exit 1
            fi
          done
          printf 'GOOGLE_MAPS_IOS_API_KEY=%s\nAPI_BASE_URL=%s\nPOSTHOG_PROJECT_TOKEN=%s\nPOSTHOG_HOST=%s\nAPP_VERSION=%s\nAPP_ENV=%s\nHOT_UPDATER_URL=%s\nHOT_UPDATER_CLIENT_KEY=%s\n' \
            "$GOOGLE_MAPS_IOS_API_KEY" "$API_BASE_URL" \
            "$POSTHOG_PROJECT_TOKEN" "$POSTHOG_HOST" "$APP_VERSION" "$APP_ENV" \
            "$HOT_UPDATER_URL" "$HOT_UPDATER_CLIENT_KEY" > "$RUNNER_TEMP/frontend-beta-config"
          chmod 600 "$RUNNER_TEMP/frontend-beta-config"
          echo "ENVFILE=$RUNNER_TEMP/frontend-beta-config" >> "$GITHUB_ENV"
          echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "SENTRY_ORG=yeogidam" >> "$GITHUB_ENV"
          echo "SENTRY_PROJECT=react-native" >> "$GITHUB_ENV"
          echo "SENTRY_URL=https://sentry.io/" >> "$GITHUB_ENV"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Install CocoaPods
        run: bundle exec pod install --project-directory=ios
      # iOS Release 빌드는 fingerprint를 빌드 시점에 다시 계산해 앱에 넣는다.
      # pod install 이후 ios/ 파일이 바뀌어 커밋된 해시와 달라지면, 그 앱은 OTA 번들을 받지 못하므로 빌드 전에 멈춘다.
      - name: Check iOS fingerprint after pod install
        run: |
          expected=$(node -p "require('./fingerprint.json').ios.hash")
          actual=$(npx hot-updater fingerprint hash -p ios | tail -1)
          if [[ "$expected" != "$actual" ]]; then
            echo "::error file=Frontend/fingerprint.json::pod install 이후 iOS fingerprint가 달라졌습니다 ($expected -> $actual). 아래 바뀐 ios/ 파일을 확인하세요."
            git status --short -- ios
            exit 1
          fi
      - name: Archive signed iOS app
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -workspace ios/Frontend.xcworkspace \
            -scheme Frontend \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Frontend.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            "MARKETING_VERSION=$APP_VERSION" \
            "CURRENT_PROJECT_VERSION=$APP_BUILD_NUMBER" \
            "GOOGLE_MAPS_IOS_API_KEY=$GOOGLE_MAPS_IOS_API_KEY" \
            "POSTHOG_PROJECT_TOKEN=$POSTHOG_PROJECT_TOKEN" \
            "POSTHOG_HOST=$POSTHOG_HOST" \
            "APP_ENV=$APP_ENV" \
            "ENVFILE=$ENVFILE" \
            archive
      # 아카이브의 심볼릭 링크와 파일 권한을 보존해 업로드 job으로 전달한다.
      - name: Package iOS archive
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Frontend.xcarchive" "$RUNNER_TEMP/Frontend.xcarchive.zip"
      - name: Upload iOS archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-beta-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Frontend.xcarchive.zip
          if-no-files-found: error
          compression-level: 0
