# Run workflow에서 fe-release 브랜치, 플랫폼, 앱 버전을 지정하면 beta 빌드를 배포한다.
# Actions 실행 번호로 빌드 번호를 정하며 Git 태그는 만들지 않는다.
name: Frontend Beta
run-name: "Frontend Beta ${{ inputs.platform }} v${{ inputs.version }} (run ${{ github.run_number }})"

# 릴리스 브랜치의 HEAD에서 수동 실행한다.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: '배포할 플랫폼'
        required: true
        type: choice
        options:
          - android
          - ios
      version:
        description: '앱 버전 (예: 1.1.0)'
        required: true
        type: string

# Android/iOS beta 업로드가 동시에 진행되지 않도록 워크플로 실행을 직렬화한다.
# 새 수동 실행이 시작돼도 현재 진행 중인 업로드는 취소하지 않는다.
concurrency:
  group: frontend-beta
  cancel-in-progress: false

# 저장소 코드를 읽는 권한만 부여한다. 스토어 인증은 fe-beta Environment Secrets를 사용한다.
permissions:
  contents: read

jobs:
  # 정확히 fe-release를 선택했는지와 입력한 앱 버전의 형식을 확인한다.
  # 실행 커밋이 원격 fe-release HEAD와 같은지도 검증한다.
  version-check:
    runs-on: ubuntu-latest
    outputs:
      # 스크립트가 GITHUB_OUTPUT에 기록한 step 출력값을 job 출력값으로 노출한다.
      # 배포 job은 needs.version-check.outputs에서 이 값을 읽는다.
      app_version: ${{ steps.version.outputs.app_version }}
      platform: ${{ steps.version.outputs.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 수동 실행 화면에서 선택한 브랜치의 실행 시점 커밋을 검사한다.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
      - name: Validate selected release branch
        id: version
        env:
          PLATFORM: ${{ inputs.platform }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node .github/scripts/frontend-release-policy.mjs validate-branch "$PLATFORM" "$RELEASE_BRANCH" "$REQUESTED_VERSION"

  # fe-beta 환경의 플랫폼별 고정 오프셋과 Actions 실행 번호를 합쳐 빌드 번호를 정한다.
  assign-build:
    needs: version-check
    runs-on: ubuntu-latest
    environment: fe-beta
    outputs:
      build_number: ${{ steps.assign.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
      - name: Assign build number
        id: assign
        env:
          PLATFORM: ${{ needs.version-check.outputs.platform }}
          APP_VERSION: ${{ needs.version-check.outputs.app_version }}
          ANDROID_BUILD_NUMBER_OFFSET: ${{ vars.ANDROID_BETA_BUILD_NUMBER_OFFSET }}
          IOS_BUILD_NUMBER_OFFSET: ${{ vars.IOS_BETA_BUILD_NUMBER_OFFSET }}
        run: |
          if [[ "$PLATFORM" == "android" ]]; then
            node .github/scripts/frontend-release-policy.mjs assign-build "$PLATFORM" "$APP_VERSION" "$ANDROID_BUILD_NUMBER_OFFSET"
          else
            node .github/scripts/frontend-release-policy.mjs assign-build "$PLATFORM" "$APP_VERSION" "$IOS_BUILD_NUMBER_OFFSET"
          fi

  # 검증과 선택한 플랫폼의 배포용 Release 빌드를 CI에서 한 번 실행한다.
  ci:
    needs: [version-check, assign-build]
    uses: ./.github/workflows/frontend-ci.yml
    with:
      beta_platform: ${{ needs.version-check.outputs.platform }}
      app_version: ${{ needs.version-check.outputs.app_version }}
      build_number: ${{ needs.assign-build.outputs.build_number }}
    secrets: inherit

  # Android를 선택했을 때만 CI에서 만든 AAB를 Google Play internal 트랙에 올린다.
  android-beta:
    needs: [version-check, ci, assign-build]
    if: needs.version-check.outputs.platform == 'android'
    runs-on: ubuntu-latest
    environment: fe-beta
    steps:
      - name: Download CI Android AAB
        uses: actions/download-artifact@v4
        with:
          name: frontend-beta-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-beta-android
      - name: Check Play upload secret
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
      # Play Console에 앱이 미리 등록되고 서비스 계정에 앱 배포 권한이 있어야 한다.
      # internal 트랙에 completed 상태로 올린다. 같은 versionCode 재업로드는 거절될 수 있다.
      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.yeogidamm.app
          releaseFiles: ${{ runner.temp }}/frontend-beta-android/app-release.aab
          tracks: internal
          status: completed

  # iOS를 선택했을 때만 CI에서 만든 아카이브를 TestFlight로 업로드한다.
  ios-beta:
    needs: [version-check, ci, assign-build]
    if: needs.version-check.outputs.platform == 'ios'
    runs-on: macos-26
    timeout-minutes: 60
    environment: fe-beta
    steps:
      - uses: actions/checkout@v6
      - name: Download CI iOS archive
        uses: actions/download-artifact@v4
        with:
          name: frontend-beta-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-beta-ios
      - name: Restore iOS archive and API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          for key in APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID; do
            if [[ -z "${!key}" ]]; then
              echo "Missing beta upload secret: $key" >&2
              exit 1
            fi
          done
          ditto -x -k "$RUNNER_TEMP/frontend-beta-ios/Frontend.xcarchive.zip" "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP/Frontend.xcarchive"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      # BetaExportOptions.plist의 app-store-connect/upload 설정으로 아카이브를 내보낸다.
      # Xcode가 배포 서명 후 App Store Connect에 직접 업로드한다.
      # TestFlight 처리와 테스터 그룹 배포는 App Store Connect에서 이어진다.
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Frontend.xcarchive" \
            -exportPath "$RUNNER_TEMP/FrontendExport" \
            -exportOptionsPlist Frontend/ios/BetaExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
