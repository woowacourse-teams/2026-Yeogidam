name: Enforce develop sources for main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  require-allowed-source:
    # Keep this name until the required-status-check rule is updated in GitHub.
    name: Require develop source branch
    runs-on: ubuntu-latest
    steps:
      - name: Allow only fe-dev and be-dev
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$HEAD_BRANCH" in
            fe-dev|be-dev)
              exit 0
              ;;
            *)
              echo "::error::Pull requests into main must originate from fe-dev or be-dev. Current source: $HEAD_BRANCH"
              exit 1
              ;;
          esac
