name: Enforce develop as main source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  require-develop:
    name: Require develop source branch
    runs-on: ubuntu-latest
    steps:
      - name: Allow only develop
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_BRANCH" != "develop" ]; then
            echo "::error::Pull requests into main must originate from develop. Current source: $HEAD_BRANCH"
            exit 1
          fi
