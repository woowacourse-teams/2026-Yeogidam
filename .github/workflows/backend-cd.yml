name: Backend CD

# be-dev에 들어가면 개발 서버로, be-release에 들어가면 운영으로 배포한다.
# 같은 이미지를 두 환경이 쓰고 환경 차이는 각 서버의 /opt/yeogidam/backend.env가 낸다.
on:
  # PR 쪽에는 paths를 걸지 않는다. be-release의 필수 체크가 Backend Verification인데,
  # paths에 안 걸리면 워크플로가 아예 돌지 않아 체크가 생기지 않는다. 그러면 깃허브는
  # 체크를 기다리는 상태로 두어 문서만 고친 PR이 영원히 머지되지 않는다.
  # be-release로 가는 PR은 출시 때만 생기므로 매번 검증해도 부담이 없다.
  pull_request:
    branches:
      - be-release
  # 코드 변경 없이 지금 HEAD로 다시 배포하는 길이다. deploy.sh는 같은 이미지면 컨테이너를 그대로
  # 두므로 서버 env만 바꾼 경우는 이 트리거로 반영되지 않고, Infra/scripts/restart-backend.sh로 손배포한다.
  # Re-run은 「Validate Deployment Target」이 GITHUB_SHA와 원격 브랜치 HEAD를 대조해 거부하므로
  # 그 뒤에 커밋이 하나라도 들어가면 쓸 수 없다. 입력은 두지 않고 브랜치만 골라 부른다.
  # 호출은 `gh workflow run backend-cd.yml --ref be-dev`다. 깃허브는 dispatch 가능 여부를 기본
  # 브랜치(main)에 있는 파일에서 읽으므로, 이 트리거가 main에 올라간 뒤부터 부를 수 있다.
  # dispatch는 아무 브랜치나 고를 수 있어서, publish와 deploy 잡의 if에서 be-dev와 be-release만
  # 통과시킨다. 그래야 승인 없는 작업 브랜치가 개발 서버에 배포되거나 Docker Hub에 올라가지 않는다.
  # be-dev의 HEAD가 문서만 고친 커밋이면 그 SHA의 이미지가 없어 publish가 새로 빌드한다. digest가
  # 달라져 컨테이너가 한 번 교체되지만 내용은 같은 코드라 해는 없다.
  workflow_dispatch:
  # 배포를 거는 push 쪽은 그대로 둔다. 문서만 고쳤을 때 배포가 나가지 않게 한다.
  push:
    branches:
      - be-dev
      - be-release
    paths:
      - Backend/**
      - "!Backend/docs/**"
      - "!Backend/README.md"
      - .github/workflows/backend-cd.yml

permissions:
  contents: read

concurrency:
  group: backend-cd-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Backend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify Backend
        run: ./gradlew check --no-daemon

  publish:
    name: Publish Docker Hub Image
    needs: verify
    # PR은 검증까지만 하고 발행과 배포로 넘기지 않는다. 트리거를 하나씩 적어 두면 나중에
    # 트리거가 늘어도 그 이벤트가 저절로 배포로 흘러가지 않는다.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["be-dev", "be-release"]'), github.ref_name) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # hotfix 판정에서 커밋에 연결된 PR의 라벨과 head 브랜치를 읽어야 한다.
    permissions:
      contents: read
      pull-requests: read
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
      IMAGE_PLATFORM: linux/arm64
      # IMAGE_TAG는 Resolve Source Commit 스텝이 정해 GITHUB_ENV로 넘긴다.
      # be-dev면 자기 SHA, be-release면 승격 대상 SHA다.

    outputs:
      image_reference: ${{ steps.result.outputs.image_reference }}
      image_digest: ${{ steps.digest.outputs.value }}

    steps:
      - name: Validate Docker Hub Configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$IMAGE_NAME" ]; then
            echo "::error::Repository variable DOCKERHUB_IMAGE를 설정해 주세요. 예: account/yeogidam-backend"
            exit 1
          fi

          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Repository variable DOCKERHUB_USERNAME을 설정해 주세요."
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Repository secret DOCKERHUB_TOKEN을 설정해 주세요."
            exit 1
          fi

          if [[ "$IMAGE_NAME" != */* || "$IMAGE_NAME" == *:* || "$IMAGE_NAME" == *@* ]]; then
            echo "::error::DOCKERHUB_IMAGE는 태그와 digest가 없는 namespace/repository 형식이어야 합니다."
            exit 1
          fi

      # 승격 판정이 머지 커밋의 부모를 읽고 be-dev와 조상 관계를 따지므로 이력이 다 필요하다.
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve Source Commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Backend/scripts/resolve-source-commit.sh

      - name: Log In to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Existing SHA Image
        id: existing
        env:
          DEPLOY_MODE: ${{ steps.source.outputs.mode }}
        run: |
          set +e
          INSPECT_RESULT="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE_TAG" 2>&1)"
          INSPECT_STATUS=$?
          set -e

          if [ "$INSPECT_STATUS" -eq 0 ]; then
            IMAGE_DIGEST="$(printf '%s' "$INSPECT_RESULT" | jq -r '.digest')"

            if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::기존 이미지의 digest를 확인할 수 없습니다."
              exit 1
            fi

            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            printf 'digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$INSPECT_RESULT" == *": not found"* || "$INSPECT_RESULT" == *"manifest unknown"* ]]; then
            # 승격 모드에서는 be-dev가 만들어 둔 이미지가 반드시 있어야 한다.
            # 없다는 것은 그 커밋의 be-dev 배포가 실패했거나 아직 안 끝났다는 뜻이다.
            # 여기서 빌드로 흘러가면 검증하지 않은 이미지가 운영에 올라간다.
            if [ "$DEPLOY_MODE" = "promote" ]; then
              echo "::error::승격할 이미지 ${IMAGE_TAG}를 찾지 못했습니다. be-dev에서 그 커밋의 배포가 끝났는지 확인해 주세요."
              exit 1
            fi

            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Docker Hub에서 기존 태그를 확인하지 못했습니다."
          printf '%s\n' "$INSPECT_RESULT"
          exit 1

      - name: Build and Publish Docker Image
        id: build
        if: ${{ steps.existing.outputs.exists == 'false' }}
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: ${{ env.IMAGE_TAG }}
          # 기본값이면 provenance 증명서가 붙어 태그 하나가 목록, 이미지, 증명서 세 조각이 되고
          # 고정하는 digest도 목록의 것이 된다. 읽는 곳이 없으므로 이미지 한 장에 digest 하나로 둔다.
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-image-arm64
          cache-to: type=gha,mode=max,scope=backend-image-arm64

      - name: Resolve Image Digest
        id: digest
        env:
          BUILT_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_IMAGE_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          if [ -n "$BUILT_IMAGE_DIGEST" ]; then
            IMAGE_DIGEST="$BUILT_IMAGE_DIGEST"
          else
            IMAGE_DIGEST="$EXISTING_IMAGE_DIGEST"
          fi

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::배포에 사용할 이미지 digest가 올바르지 않습니다."
            exit 1
          fi

          printf 'value=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Record Publish Result
        id: result
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
          EXISTING_IMAGE: ${{ steps.existing.outputs.exists }}
          DEPLOY_MODE: ${{ steps.source.outputs.mode }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          IMAGE_REFERENCE="${IMAGE_NAME}@${IMAGE_DIGEST}"

          if [ "$DEPLOY_MODE" = "promote" ]; then
            RESULT="be-dev 이미지 승격"
          elif [ "$EXISTING_IMAGE" = "true" ]; then
            RESULT="기존 이미지 재사용"
          else
            RESULT="신규 이미지 발행"
          fi

          printf 'image_reference=%s\n' "$IMAGE_REFERENCE" >> "$GITHUB_OUTPUT"

          {
            printf '## Backend Docker 이미지 발행\n\n'
            printf -- '- Git SHA: `%s`\n' "$GITHUB_SHA"
            printf -- '- 이미지 기준 커밋: `%s`\n' "$SOURCE_SHA"
            printf -- '- 태그: `%s`\n' "$IMAGE_TAG"
            printf -- '- 배포 참조: `%s`\n' "$IMAGE_REFERENCE"
            printf -- '- 플랫폼: `%s`\n' "$IMAGE_PLATFORM"
            printf -- '- 결과: `%s`\n' "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  # 배포 대상은 브랜치가 정한다. be-release면 운영 러너, 그 밖(be-dev)이면 개발 러너다.
  # workflow_dispatch의 ref_name은 고른 브랜치 이름이라 아래 삼항이 push와 같은 값을 낸다.
  deploy:
    name: Deploy Backend
    needs: publish
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["be-dev", "be-release"]'), github.ref_name) }}
    runs-on:
      - self-hosted
      - linux
      - ARM64
      - ${{ github.ref_name == 'be-release' && 'backend-production' || 'backend-development' }}
    timeout-minutes: 15
    concurrency:
      group: backend-${{ github.ref_name == 'be-release' && 'production' || 'development' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'be-release' && '운영' || '개발' }}
      EXPECTED_SPRING_PROFILE: ${{ github.ref_name == 'be-release' && 'prod' || 'dev' }}
      IMAGE_REFERENCE: ${{ needs.publish.outputs.image_reference }}
      EXPECTED_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
      BACKEND_ENV_FILE: ${{ vars.BACKEND_ENV_FILE }}
      BACKEND_HOST_PORT: ${{ vars.BACKEND_HOST_PORT }}
      BACKEND_CONTAINER_NAME: ${{ vars.BACKEND_CONTAINER_NAME || 'yeogidam-backend' }}
      # 바인딩 주소는 deploy.sh의 상수(127.0.0.1)다. 변수로 두면 0.0.0.0을 넣는 순간
      # 앱이 TLS 없이 인터넷에 노출되므로 여기서 받지 않는다.
      BACKEND_HEALTH_TIMEOUT_SECONDS: ${{ vars.BACKEND_HEALTH_TIMEOUT_SECONDS || '150' }}
      # t4g.micro 910Mi에서 러너와 dockerd 등이 고정으로 280MB를 쓰므로 앱에 512MB를 준다.
      # SWAP_LIMIT은 메모리와 스왑의 합계라서 768m이면 스왑 몫이 256MB다.
      BACKEND_MEMORY_LIMIT: ${{ vars.BACKEND_MEMORY_LIMIT || '512m' }}
      BACKEND_MEMORY_SWAP_LIMIT: ${{ vars.BACKEND_MEMORY_SWAP_LIMIT || '768m' }}
      # 컨테이너 로그는 awslogs 드라이버가 CloudWatch 로그 그룹 /yeogidam/<프로필>/backend로 보낸다.
      # 아래 두 값은 docker logs용으로 서버에 남기는 로컬 캐시의 상한이라 CloudWatch 보존 기간과는 무관하다.
      BACKEND_LOG_MAX_SIZE: ${{ vars.BACKEND_LOG_MAX_SIZE || '10m' }}
      BACKEND_LOG_MAX_FILE: ${{ vars.BACKEND_LOG_MAX_FILE || '3' }}

    steps:
      - name: Checkout Deployment Script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # workflow_dispatch로 불렀을 때는 GITHUB_SHA가 고른 브랜치의 HEAD라 이 대조를 통과한다.
      # 거부되는 쪽은 그 뒤에 커밋이 들어간 오래된 실행의 Re-run이다.
      - name: Validate Deployment Target
        run: |
          CURRENT_BRANCH_SHA="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 { print $1 }')"

          if [ -z "$CURRENT_BRANCH_SHA" ]; then
            echo "::error::현재 $GITHUB_REF_NAME SHA를 확인하지 못했습니다."
            exit 1
          fi

          if [ "$CURRENT_BRANCH_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::현재 $GITHUB_REF_NAME HEAD가 아닌 오래된 실행이므로 배포하지 않습니다."
            exit 1
          fi

      - name: Validate Deployment Credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_READ_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Repository variable DOCKERHUB_USERNAME을 설정해 주세요."
            exit 1
          fi

          if [ -z "$DOCKERHUB_READ_TOKEN" ]; then
            echo "::error::Repository secret DOCKERHUB_READ_TOKEN을 설정해 주세요."
            exit 1
          fi

      - name: Prepare Temporary Docker Configuration
        env:
          TEMP_DOCKER_CONFIG: ${{ runner.temp }}/yeogidam-docker-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$TEMP_DOCKER_CONFIG"
          chmod 700 "$TEMP_DOCKER_CONFIG"
          printf 'DOCKER_CONFIG=%s\n' "$TEMP_DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Log In to Docker Hub for Deployment
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}
          logout: true

      - name: Deploy and Verify Backend
        run: bash Backend/scripts/deploy.sh
