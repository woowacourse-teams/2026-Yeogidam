plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.yeogidam'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.55.6')
    implementation 'software.amazon.awssdk:s3'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    //Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation('org.projectlombok:lombok')
    annotationProcessor('org.projectlombok:lombok')

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation('org.projectlombok:lombok')
    testAnnotationProcessor('org.projectlombok:lombok')
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'eval'
    }
}

// 골든셋 채점. 인스타그램, Gemini, 카카오를 실제로 부르므로 CI에서는 돌리지 않고 손으로만 돌린다(eval/README.md).
tasks.register('evalTest', Test) {
    description = '골든셋 40건을 운영 빈으로 돌려 eval/results/summary.md를 쓴다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'eval'
    }
    outputs.upToDateWhen { false }
    // ./gradlew evalTest -Deval.cases=C016,C022 처럼 몇 건만 돌릴 수 있다
    systemProperty 'eval.cases', System.getProperty('eval.cases', '')
    // 저장된 예측으로 정답만 다시 채점할 때는 외부 API를 부르지 않는다.
    systemProperty 'eval.results-file', System.getProperty('eval.results-file', '')
    testLogging {
        showStandardStreams = true
    }
}
