# 프로필: local(개발자 노트북), test(Gradle 테스트), dev(개발 서버), prod(운영). 사용법은 docs/profiles.md.
# 프로필을 지정하지 않으면 local로 뜬다. 서버는 SPRING_PROFILES_ACTIVE로 명시한다.
spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local

  # schema.sql이 DROP TABLE로 시작하므로 공통 기본값은 never다. local과 test만 always로 켠다.
  sql:
    init:
      mode: never

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 서버에서는 nginx 뒤에서 돈다. 이 값이 없으면 앱이 자기를 http://127.0.0.1:8080으로 알아서
# 리다이렉트와 생성 URL이 http로 나간다. native는 톰캣이 X-Forwarded-*를 읽되 사설 대역과
# 루프백에서 온 것만 믿으므로, 127.0.0.1의 nginx는 통과하고 그 밖은 무시한다.
server:
  forward-headers-strategy: native

oauth:
  providers:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}

jwt:
  secret: ${JWT_SECRET}
  issuer: yeogidam
  access-token-ttl: 30m
  refresh-token-ttl: 30d

media:
  extraction:
    pipeline-version: 1

# 앱 업데이트 정책. 최소 버전 아래는 강제, 최신 버전 아래는 권고다.
# 프로필로 나누지 않고 여기 한 곳에 둔다. 값을 바꿀 때는 커밋하고 배포한다(docs/profiles.md 6절).
app-update:
  ios:
    minimum-supported-version: 1.1.0
    latest-version: 1.1.0
    store-url: https://apps.apple.com/kr/app/%EC%97%AC%EA%B8%B0%EB%8B%B4/id6801408355
  android:
    minimum-supported-version: 1.1.0
    latest-version: 1.1.0
    store-url: https://play.google.com/store/apps/details?id=com.yeogidamm.app&pcampaignid=web_share

# health는 배포 헬스체크용이라 기동 여부만 보고 세부는 감춘다. metrics는 부하를 걸 때 서버 안에서
# 커넥션 풀(hikaricp.connections.*)과 힙, 톰캣 스레드를 보기 위한 것이다. 앱이 127.0.0.1에만 열려 있고
# nginx가 /actuator를 404로 막으므로 둘 다 밖에서는 보이지 않는다. CloudWatch로 보내지는 않는다(지표당 과금).
management:
  health:
    defaults:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,metrics
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: false
      group:
        liveness:
          include: livenessState
      show-components: never
      show-details: never
