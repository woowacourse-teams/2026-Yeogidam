# 운영 전용. 스키마는 컷오버 전에 Flyway로 옮기기 전까지 손으로 적용한다(docs/profiles.md 6절).
# DB, JWT, OAuth 값은 /opt/yeogidam/backend.env가 환경변수로 넣는다.
spring:
  sql:
    init:
      mode: never

media:
  thumbnail:
    instagram-key-prefix: yeogidam/prod/instagram-thumbnails
    place-key-prefix: yeogidam/prod/place-thumbnails

# 운영에서는 API 문서를 열지 않는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 로그를 JSON 한 줄로 찍는다. CloudWatch Logs에서 level 키로 ERROR 건수를 세는 지표 필터를 걸기 위해서다.
# logstash 형식은 level, logger_name, message가 점 없는 평평한 키라 지표 필터 { $.level = "ERROR" }가 그대로 먹고,
# MDC 항목(requestId, httpMethod, path, status, durationMs)이 최상위 키로 들어간다. ecs 형식은 "log.level"처럼
# 점이 든 키라 필터 식이 불편해서 쓰지 않는다. local과 test는 사람이 읽는 텍스트 로그를 유지해야 하므로
# application.yml에는 두지 않는다.
logging:
  structured:
    format:
      console: logstash
