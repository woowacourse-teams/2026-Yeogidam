# 개발 서버 전용. 스키마는 손으로 적용하므로 기동 때 건드리지 않는다(docs/profiles.md 6절).
# DB, JWT, OAuth 값은 /opt/yeogidam/backend.env가 환경변수로 넣는다.
#
# 앱 업데이트 정책은 값을 적지 않아 application.yml 기본값을 그대로 쓴다. 운영과 같은 값이다.
# dev에서만 다르게 시험하려면 아래 블록을 살린다. 적은 키만 덮이고 나머지는 기본값이 남는다.
# 최소 버전만 올리면 최신 버전이 기본값이라 최소보다 낮아지고, PlatformPolicy 생성자 검증이
# 예외를 던져 앱이 아예 뜨지 못한다. 최소를 올릴 때는 최신도 같이 올린다.
#
# app-update:
#   ios:
#     minimum-supported-version: 1.2.0
#     latest-version: 1.3.0
#   android:
#     minimum-supported-version: 1.2.0
#     latest-version: 1.3.0
spring:
  sql:
    init:
      mode: never

media:
  thumbnail:
    instagram-key-prefix: yeogidam/dev/instagram-thumbnails
    place-key-prefix: yeogidam/dev/place-thumbnails

# 로그를 JSON 한 줄로 찍는다. CloudWatch Logs에서 level 키로 ERROR 건수를 세는 지표 필터를 걸기 위해서다.
# logstash 형식은 level, logger_name, message가 점 없는 평평한 키라 지표 필터 { $.level = "ERROR" }가 그대로 먹고,
# MDC 항목(requestId, httpMethod, path, status, durationMs)이 최상위 키로 들어간다. ecs 형식은 "log.level"처럼
# 점이 든 키라 필터 식이 불편해서 쓰지 않는다. local과 test는 사람이 읽는 텍스트 로그를 유지해야 하므로
# application.yml에는 두지 않는다.
logging:
  structured:
    format:
      console: logstash
