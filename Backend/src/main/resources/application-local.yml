# 로컬 실행 전용. 새 마이그레이션 적용 후 업무 데이터만 비우고 회원, 로컬 데이터, 온보딩 데이터를 넣는다.
# 테이블 구조와 Flyway 실행 기록은 다음 실행에도 유지한다.
# 프로필을 지정하지 않으면 이 프로필로 뜬다(application.yml의 spring.profiles.default).
# 회원 행은 LocalMemberSeeder가 .env의 카카오 회원번호로 넣는다. docs/profiles.md 참고.
seed:
  kakao-user-id:
    bean: ${SEED_KAKAO_USER_ID_BEAN:}
    lucky: ${SEED_KAKAO_USER_ID_LUCKY:}

media:
  thumbnail:
    instagram-key-prefix: yeogidam/local/instagram-thumbnails
    place-key-prefix: yeogidam/local/place-thumbnails
